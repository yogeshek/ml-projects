version: '3.8'

services:
  # SMS Spam Detection API
  spam-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spam-detection-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    volumes:
      # Mount models directory (for development)
      - ../../../../models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Redis for caching (optional - for advanced features)
  redis:
    image: redis:7-alpine
    container_name: spam-detection-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Nginx reverse proxy (optional - for production)
  nginx:
    image: nginx:alpine
    container_name: spam-detection-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - spam-api
    restart: unless-stopped

volumes:
  redis-data:
